- number: "01"
  slug: "bench-status-pad"
  title: "Bench Status Pad"
  state: "Structure study"
  discipline: "The Examiner's Bench"
  discipline_slug: "examiner-bench"
  path: "Useful tool"
  path_slug: "workbench"
  format: "4 × 6 tear-away notepad"
  audience: "The examiner stepping away from an active case overnight, over a weekend, or through an interruption"
  need: "Restore the active case state without reconstructing yesterday from six windows and a half-remembered thought"
  note: "A disposable continuity sheet for the current process, last completed action, next step, pending issue, output reference, and the one thing that must not be forgotten."
  design_test: "Monday-morning context returns in under thirty seconds."
  visual: "status-pad"
  details:
    - "Current process and tool state"
    - "Last completed action"
    - "Next intended action"
    - "Pending question or blocker"
    - "Secure-disposal reminder"
- number: "02"
  slug: "examination-notebook"
  title: "Examination Notebook"
  state: "Page architecture study"
  discipline: "The Examiner's Bench"
  discipline_slug: "examiner-bench"
  path: "For the room"
  path_slug: "workspace"
  format: "Purpose-built tactile notebook"
  audience: "The examiner who thinks better with a pen in hand"
  need: "Offer enough structure to orient the work without turning every page into somebody else's boxes"
  note: "A lightly structured notebook with case orientation, source indexing, tool references, open questions, and generous pages that still belong to the examiner."
  design_test: "The structure disappears until it is needed; the writing space never does."
  visual: "notebook"
  details:
    - "Case and authority snapshot"
    - "Evidence-source index"
    - "Tool and version references"
    - "Open questions and findings index"
    - "Generous, lightly ruled note pages"
