- number: "04"
  slug: "preserved-until-it-matters"
  title: "Preserved Until It Matters"
  state: "Writing and visual study"
  discipline: "The Evidence Room"
  discipline_slug: "evidence-room"
  path: "Wall edition"
  path_slug: "editions"
  format: "Mounted wall edition"
  audience: "Property and evidence professionals whose best work may not reveal its value for years"
  need: "Give visual weight to the patience and discipline that preserve future answers"
  note: "An edition about the ordinary object that remains properly identified, stored, and available until a later question finally gives it meaning."
  design_test: "The piece should make preservation feel consequential without becoming sentimental or theatrical."
  visual: "evidence-edition"
  details:
    - "An ordinary object treated with quiet gravity"
    - "Evidence labeling as texture, not decoration"
    - "A long-time horizon built into the composition"
    - "Language centered on preservation and possibility"
