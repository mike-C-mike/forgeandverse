baseURL = "https://forgeandverse.com/"
locale = "en-US"
title = "Forge & Verse"
enableRobotsTXT = true
summaryLength = 28
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 12

[params]
  frameworkVersion = "18.0"
  description = "Art, writing, and useful objects for the people who examine, protect, preserve, and defend."
  studioLine = "An independent literary-industrial design studio for people whose work carries weight."
  founder = "Matthew McBride"
  defaultImage = "/images/social/forge-and-verse-card.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
