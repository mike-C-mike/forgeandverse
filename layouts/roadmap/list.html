{{ define "main" }}
<header class="page-hero page-hero-compact page-hero-dark">
  <div class="wrap page-hero-grid">
    <div><p class="eyebrow">Works in progress</p><h1>{{ .Title }}</h1></div>
    <p>{{ .Description }}</p>
  </div>
</header>
<section class="section workbench-section">
  <div class="wrap">
    <div class="workbench-grid">
      {{ range site.Data.roadmap }}
      <article class="workbench-card">
        <div class="workbench-card-top">
          <span class="workbench-state">{{ .state }}</span>
          <span class="workbench-number">{{ .number }}</span>
        </div>
        <h2>{{ .title }}</h2>
        <p>{{ .note }}</p>
        <dl>
          <div><dt>Room</dt><dd>{{ .discipline }}</dd></div>
          <div><dt>Form</dt><dd>{{ .format }}</dd></div>
        </dl>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
