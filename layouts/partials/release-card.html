<article class="release-card">
  <a href="{{ .RelPermalink }}" class="release-card-link">
    {{ with .Params.preview_image }}<div class="release-card-image"><img src="{{ . }}" alt="" loading="lazy"></div>{{ end }}
    <div class="release-card-copy">
      <div class="release-card-meta"><span>Free work</span><span>{{ partial "discipline-label.html" .Params.discipline }}</span></div>
      <h3>{{ .Title }}</h3>
      <p>{{ .Params.summary }}</p>
      <span class="release-card-action">View the release <b aria-hidden="true">→</b></span>
    </div>
  </a>
</article>
