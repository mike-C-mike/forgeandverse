{{ define "main" }}
<header class="page-hero page-hero-compact">
  <div class="wrap page-hero-grid">
    <div><p class="eyebrow">Disciplines</p><h1>The rooms</h1></div>
    <p>{{ .Description }}</p>
  </div>
</header>
<section class="section discipline-directory">
  <div class="wrap discipline-directory-grid">
    {{ range hugo.Data.disciplines }}
    <a class="discipline-directory-card{{ if eq .priority 1 }} discipline-directory-card-primary{{ end }}" href="{{ .page }}">
      <div class="discipline-directory-top">
        <span>0{{ .priority }}</span>
        <small>{{ .plain_name }}</small>
      </div>
      <h2>{{ .name }}</h2>
      <p class="discipline-directory-line">{{ .line }}</p>
      <p>{{ .description }}</p>
      <div class="discipline-directory-paths" aria-hidden="true">
        {{ range .paths }}<span>{{ .label }}</span>{{ end }}
      </div>
      <strong>Enter the room <b aria-hidden="true">→</b></strong>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
